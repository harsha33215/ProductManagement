spring:
  datasource:
    url: "jdbc:postgresql://${POSTGRES_TEST_HOST:localhost}:${POSTGRES_TEST_PORT:5432}/product_management_test"
    username: ${POSTGRES_TEST_USERNAME}
    password: ${POSTGRES_TEST_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-postgres-test.sql
      separator: "@@"
      continue-on-error: false
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
