
spring:
  application:
    name: ProductManagement

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 200
          order_inserts: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 9090

aws:
  s3:
    region: ${AWS_REGION:ap-south-2}
    bucket: ${AWS_S3_BUCKET:product-management-files-harsha}
